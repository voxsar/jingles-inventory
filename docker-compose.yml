version: '3.9'

services:
  # PostgreSQL database for local development
  postgres:
    image: postgres:16-alpine
    container_name: jingles-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: jingles_inventory
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API server
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile.dev
    container_name: jingles-backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:password@postgres:5432/jingles_inventory}
      JWT_SECRET: ${JWT_SECRET:-test-only-jwt-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JINGLES_POS_SYNC_APP_TOKEN: ${JINGLES_POS_SYNC_APP_TOKEN:-test-only-pos-sync-token}
      PORT: ${PORT:-3001}
      NODE_ENV: ${NODE_ENV:-development}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - '3001:3001'
    volumes:
      - ./packages/backend:/app/packages/backend
      - ./packages/shared:/app/packages/shared
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: >-
      sh -c "cd packages/backend
      && npx prisma db push --accept-data-loss
      && npx prisma generate
      && cd ../shared
      && npm run build
      && cd ../backend
      && TS_NODE_TRANSPILE_ONLY=true npm run prisma:seed
      && npm run dev"

  # Inventory management web UI, served from the same WSL/Docker test stack.
  web:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile.dev
    container_name: jingles-inventory-web
    environment:
      VITE_API_BASE_URL: http://backend:3001
    ports:
      - '5173:5173'
    depends_on:
      - backend
    command: npm run dev --workspace=packages/web -- --host 0.0.0.0

volumes:
  postgres-data:
