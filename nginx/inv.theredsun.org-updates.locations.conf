# Include these locations inside the HTTPS server block for inv.theredsun.org.
# The exact metadata locations prevent missing update files from falling through
# to the React application's index.html.

location = /updates/inventory/latest.yml {
    alias /var/www/federation-inventory/desktop-updates/inventory/latest.yml;
    default_type application/yaml;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /updates/inventory/ {
    alias /var/www/federation-inventory/desktop-updates/inventory/;
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /updates/legacy-sync/latest.yml {
    alias /var/www/federation-inventory/desktop-updates/legacy-sync/latest.yml;
    default_type application/yaml;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /updates/legacy-sync/ {
    alias /var/www/federation-inventory/desktop-updates/legacy-sync/;
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}
