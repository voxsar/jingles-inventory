# Project-scoped MCP configuration. Codex loads this only after the repository is trusted.

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
enabled = true
required = false
startup_timeout_sec = 30
tool_timeout_sec = 60
default_tools_approval_mode = "auto"

[mcp_servers.dbhub_inventory]
command = "npx"
args = ["-y", "@bytebase/dbhub@latest", "--config", ".codex/dbhub.toml"]
cwd = "."
env = { DBHUB_INVENTORY_URL = "postgresql://postgres:password@127.0.0.1:5432/jingles_inventory" }
enabled = true
required = false
startup_timeout_sec = 30
tool_timeout_sec = 30
default_tools_approval_mode = "auto"
